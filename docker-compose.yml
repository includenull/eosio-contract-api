services:
  eosio-contract-api-filler:
    container_name: eosio-contract-api-filler
    build: .
    command: yarn run start:filler
    restart: on-failure
    depends_on:
      eosio-contract-api-postgres:
        condition: service_healthy
      eosio-contract-api-redis:
        condition: service_healthy
    volumes:
      - ./config:/home/application/app/config
    networks:
      - eosio-contract-api
  eosio-contract-api-server:
    container_name: eosio-contract-api-server
    build: .
    command: yarn run start:server
    restart: on-failure
    ports:
      - "9000:9000"
      - "127.0.0.1:9010:9010"
    depends_on:
      eosio-contract-api-postgres:
        condition: service_healthy
      eosio-contract-api-redis:
        condition: service_healthy
    volumes:
      - ./config:/home/application/app/config
    networks:
      - eosio-contract-api
  eosio-contract-api-redis:
    container_name: eosio-contract-api-redis
    image: redis:8-alpine
    restart: on-failure
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker/redis/data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - eosio-contract-api
  eosio-contract-api-postgres:
    container_name: eosio-contract-api-postgres
    image: postgres:18
    restart: on-failure
    shm_size: '8gb'
    environment:
      - 'POSTGRES_USER=root'
      - 'POSTGRES_PASSWORD=changeme'
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - eosio-contract-api
networks:
  eosio-contract-api:
    driver: bridge
